networks:
  shared_autonomy_net:
    driver: bridge

services:
  web_input_bridge:
    restart: unless-stopped
    build: 
      context: ./src/web_bridge
    ports:
      - "8080:8080"
    networks:
      - shared_autonomy_net
    volumes:
      - ./src/web_bridge:/app
      # read-only access so the web server can list and serve MCAP recordings
      - ./recordings:/recordings:ro

  perception_processor:
    restart: unless-stopped
    build: 
      context: ./src/perception
    networks:
      - shared_autonomy_net
    volumes:
      - ./src/perception:/ros2_ws/src/perception
    depends_on:
      - web_input_bridge

  simulation_control:
    restart: unless-stopped
    platform: linux/amd64    
    build: 
      context: ./src/simulation
    ports:
      - "1234:1234"
      - "5001:5000"
    networks:
      - shared_autonomy_net
    volumes:
      - ./src/simulation:/ros2_ws/src/simulation
    # CRITICAL: Required for 3D software rendering (Webots + Xvfb)
    shm_size: '2gb' 

  supervisor:
    restart: unless-stopped
    build:
      context: ./src/supervisor
    networks:
      - shared_autonomy_net
    environment:
      # flip if left/right selection feels mirrored on your webcam
      - HEAD_YAW_SIGN=-1
    volumes:
      # MCAP session recordings land here on the host (Foxglove-ready)
      - ./recordings:/recordings
    depends_on:
      - simulation_control
